<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media App</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const app = document.getElementById("app");

      function HomePage() {
        const resolutions = [
          // "4096x2160", // 256:135
          // "3840x2160", // 16:9
          "1920x1080", // 16:9
          "1680x1050", // 16:10
          "1600x1200", // 4:3
          "1440x900", // 16:10
          "1400x1050", // 4:3
          "1366x768", // 16:9
          "1360x768", // 85:48
          "1280x1024", // 5:4
          "1280x960", // 4:3
          "1280x800", // 16:10
          "1280x768", // 5:3
          "1280x720", // 16:9
          "1024x768", // 4:3
          "800x600", // 4:3
          "720x576", // 5:4
          "720x480", // 3:2
          "640x480", // 4:3
        ];

        // async function tryResolutionAsync(w, h) {
        //   try {
        //     const stream = await navigator.mediaDevices.getUserMedia({
        //       video: { width: { exact: w }, height: { exact: h } },
        //     });

        //     const track = stream.getVideoTracks()[0];
        //     const settings = track.getSettings();
        //     console.log(`Got: ${settings.width}x${settings.height}`);

        //     stream.getTracks().forEach((t) => t.stop());
        //   } catch (error) {
        //     if (error.name === "OverconstrainedError") {
        //       console.log(`Resolution ${w}x${h} not supported`);
        //     } else console.error("Error:", error);
        //   }
        // }

        // async function tryManyResolutionsAsync() {
        //   for (const res of resolutions) {
        //     const [width, height] = res.split("x");
        //     await tryResolutionAsync(width, height);
        //   }
        // }

        async function promptForPermissionAsync() {
          await navigator.mediaDevices
            .getUserMedia({ video: true })
            .then((mS) => mS.getTracks().forEach((track) => track.stop()))
            .catch((error) => console.log("Error:", error.message));
        }

        const [listedDevices, setListedDevices] = React.useState([]);
        const [selectedDevice, setSelectedDevice] = React.useState("");
        const [selectedResolution, setSelectedResolution] = React.useState("1280x720");
        const [isVideoOpened, setIsVideoOpened] = React.useState(false);

        async function handleListDevices() {
          await promptForPermissionAsync();
          // await tryManyResolutionsAsync();
          let devices = await navigator.mediaDevices.enumerateDevices();
          devices = devices.filter((d) => d.kind === "videoinput");
          setListedDevices(devices);
          if (devices.length) setSelectedDevice(devices[0].deviceId);
        }

        return (
          <div>
            <div>
              <button onClick={handleListDevices}>List devices</button>

              <select value={selectedDevice} onChange={(e) => setSelectedDevice(e.target.value)}>
                <option value="" disabled>
                  -- Select device --
                </option>
                {listedDevices.map(({ deviceId, label }) => (
                  <option key={deviceId} value={deviceId}>
                    {label}
                  </option>
                ))}
              </select>

              <select value={selectedResolution} onChange={(e) => setSelectedResolution(e.target.value)}>
                {resolutions.map((res) => (
                  <option key={res} value={res}>
                    {res}
                  </option>
                ))}
              </select>

              {isVideoOpened ? (
                <button disabled={!isVideoOpened} onClick={() => setIsVideoOpened(false)}>
                  Close
                </button>
              ) : (
                <button disabled={!selectedDevice || !selectedResolution} onClick={() => setIsVideoOpened(true)}>
                  Open
                </button>
              )}
            </div>
            {isVideoOpened && <Video deviceId={selectedDevice} resolution={selectedResolution} />}
          </div>
        );
      }

      function Video({ deviceId, resolution }) {
        const videoRef = React.useRef(null);
        const [width, height] = resolution.split("x").map((x) => Number(x));

        React.useEffect(() => {
          let mediaStream;

          async function startVideo() {
            mediaStream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId, width, height },
            });
            videoRef.current.srcObject = mediaStream;
            await videoRef.current.play();
          }
          startVideo();

          return () => {
            mediaStream?.getTracks().forEach((t) => t.stop());
          };
        }, [deviceId, width, height]);

        return <video ref={videoRef} />;
      }

      const root = ReactDOM.createRoot(app);
      root.render(<HomePage />);
    </script>
  </body>
</html>
