<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media App</title>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const resList = [
        "4096x2160", // 256:135
        "3840x2160", // 16:9
        "1920x1080", // 16:9
        "1680x1050", // 16:10
        "1600x1200", // 4:3
        "1440x900", // 16:10
        "1400x1050", // 4:3
        "1366x768", // 16:9
        "1360x768", // 85:48
        "1280x1024", // 5:4
        "1280x960", // 4:3
        "1280x800", // 16:10
        "1280x768", // 5:3
        "1280x720", // 16:9
        "1024x768", // 4:3
        "800x600", // 4:3
        "720x576", // 5:4
        "720x480", // 3:2
        "640x480", // 4:3
      ];

      function HomePage() {
        const [listedDevices, setListedDevices] = React.useState([]);
        const [selectedDeviceId, setSelectedDeviceId] = React.useState("");
        const [resolutions, setResolutions] = React.useState({});
        const [selectedResolution, setSelectedResolution] = React.useState("");
        const [scaleFactor, setScaleFactor] = React.useState(2);
        const [isVideoOpened, setIsVideoOpened] = React.useState(false);

        const [isListingDevices, setIsListingDevices] = React.useState(false);
        async function handleListDevices() {
          setIsListingDevices(true);

          // prompt for permission
          await navigator.mediaDevices
            .getUserMedia({ video: true })
            .then((mS) => mS.getTracks().forEach((track) => track.stop()))
            .catch((error) => console.log("Error:", error.message));

          let devices = await navigator.mediaDevices.enumerateDevices();
          devices = devices.filter((d) => d.kind === "videoinput");
          setListedDevices(devices);
          // if (devices.length) setSelectedDeviceId(devices[0].deviceId);

          setIsListingDevices(false);
        }

        const [isCheckingResolutions, setIsCheckingResolutions] = React.useState(false);
        async function handleCheckResolutions() {
          setIsCheckingResolutions(true);

          const supported = [];
          for (const res of resList) {
            const [w, h] = res.split("x");

            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: selectedDeviceId }, width: { exact: w }, height: { exact: h } },
              });

              const settings = stream.getVideoTracks()[0].getSettings();
              console.log(`✅ ${res} supported`);
              supported.push(res);

              stream.getTracks().forEach((t) => t.stop());
            } catch (error) {
              if (error.name === "OverconstrainedError") console.log(`⛔ ${res} unusable`);
              else console.error("Error:", error);
            }
          }
          setResolutions((prev) => ({ ...prev, [selectedDeviceId]: supported }));

          if (supported.includes("1280x720")) setSelectedResolution("1280x720");

          setIsCheckingResolutions(false);
        }

        function handleSelectDevice(e) {
          setSelectedDeviceId(e.target.value);
          if (resolutions[selectedDeviceId]?.includes("1280x720")) setSelectedResolution("1280x720");
          else setSelectedResolution("");
          setIsVideoOpened(false);
        }

        return (
          <div>
            <div>
              <button disabled={isListingDevices} onClick={handleListDevices}>
                🔄
              </button>
              <select value={selectedDeviceId} onChange={handleSelectDevice}>
                <option value="" disabled>
                  -- Select device --
                </option>
                {listedDevices.map(({ deviceId, label }) => (
                  <option key={deviceId} value={deviceId}>
                    {label}
                  </option>
                ))}
              </select>

              <button disabled={!selectedDeviceId || isCheckingResolutions} onClick={handleCheckResolutions}>
                🔄
              </button>
              <select value={selectedResolution} onChange={(e) => setSelectedResolution(e.target.value)}>
                <option value="" disabled>
                  -- Select resolution --
                </option>
                {resolutions[selectedDeviceId]?.map((res) => (
                  <option key={res} value={res}>
                    {res}
                  </option>
                ))}
              </select>

              <button onClick={() => setScaleFactor((s) => Math.max(1, s - 1))}>-</button>
              <span>{scaleFactor}x</span>
              <button onClick={() => setScaleFactor((s) => Math.min(8, s + 1))}>+</button>

              <button
                disabled={!selectedDeviceId || !selectedResolution}
                onClick={() => setIsVideoOpened((prev) => !prev)}
              >
                {isVideoOpened ? "🔴" : "🔵"}
              </button>
            </div>
            {isVideoOpened && (
              <Video deviceId={selectedDeviceId} resolution={selectedResolution} scaleFactor={scaleFactor} />
            )}
          </div>
        );
      }

      function useDevicePixelRatio() {
        const [dpr, setDpr] = React.useState(window.devicePixelRatio || 1);

        React.useEffect(() => {
          let mql;

          function updateDpr() {
            const newDpr = window.devicePixelRatio || 1;
            setDpr(newDpr);

            // Media query only fires once for the ratio it was created with,
            // so re-subscribe to a fresh query matching the new ratio.
            mql?.removeEventListener("change", updateDpr);
            mql = window.matchMedia(`(resolution: ${newDpr}dppx)`);
            mql.addEventListener("change", updateDpr);
          }

          mql = window.matchMedia(`(resolution: ${dpr}dppx)`);
          mql.addEventListener("change", updateDpr);

          return () => mql?.removeEventListener("change", updateDpr);
        }, []);

        return dpr;
      }

      function Video({ deviceId, resolution, scaleFactor }) {
        const canvasRef = React.useRef(null);
        const [width, height] = resolution.split("x").map(Number);
        const dpr = useDevicePixelRatio();

        React.useEffect(() => {
          let mediaStream;
          let rafId;
          let video; // off-DOM video element used purely as a decode source

          async function startVideo() {
            mediaStream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: deviceId }, width, height },
            });

            video = document.createElement("video");
            video.srcObject = mediaStream;
            video.muted = true;
            await video.play();

            const canvas = canvasRef.current;
            canvas.width = width; // backing store = native resolution
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.imageSmoothingEnabled = false; // no smoothing when drawing frame in

            function draw() {
              ctx.drawImage(video, 0, 0, width, height);
              // requestVideoFrameCallback syncs to actual video frame delivery,
              // rather than the display refresh rate — more efficient & correct.
              if (video.requestVideoFrameCallback) {
                rafId = video.requestVideoFrameCallback(draw);
              } else {
                rafId = requestAnimationFrame(draw); // fallback for older browsers
              }
            }
            draw();
          }
          startVideo();

          return () => {
            if (video?.cancelVideoFrameCallback && rafId) video.cancelVideoFrameCallback(rafId);
            else if (rafId) cancelAnimationFrame(rafId);
            mediaStream?.getTracks().forEach((t) => t.stop());
          };
        }, [deviceId, resolution]);

        return (
          <canvas
            ref={canvasRef}
            style={{
              width: `${(width * scaleFactor) / dpr}px`,
              height: `${(height * scaleFactor) / dpr}px`,
              imageRendering: "pixelated",
            }}
          />
        );
      }

      const app = document.getElementById("app");
      const root = ReactDOM.createRoot(app);
      root.render(<HomePage />);
    </script>
  </body>
</html>
